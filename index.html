<!DOCTYPE html>
<html lang="es">

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <a class="skip" href="#sobre-mi">Ir al contenido</a>

  <header class="top">

    <nav aria-label="Principal">

    <p id="pie"></p>
